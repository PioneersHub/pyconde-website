# ──────────────────────────────────────────────────────────────
# Social cards for site pages — what `make page-cards` draws
# ──────────────────────────────────────────────────────────────
#
# One recipe per Lektor page model: which card category (and so which
# visual family, see `categories` in brand.yaml) and which page fields fill
# the card. A model needs a `social_card_image` field to carry a card.
#
# Recipe keys:
#   category    brand.yaml category; fixes the card's visual family
#   headline    page field printed as the headline
#   headline_text  fixed headline per language, instead of a page field
#   kicker      page field printed verbatim as the kicker
#   speakers    page field with names; "Name One & Name Two" gives two
#   kicker_from page field whose value picks the kicker from the
#               category's kicker_by_<field> table
#   event       whose dates the footer shows: conference | masterclasses
#   day_field   page field that must name that event day; a page that
#               names another day gets no card
#   sponsor_logo   page field with the logo's site path (/static/…)
# ──────────────────────────────────────────────────────────────

# Past editions are static and keep their cards.
skip_dirs: [archive]

# Talk cards come from Pretalx data: utils/social_card_img_gen.py.
skip_models: [talk]

# Recipes still being confirmed: shown by `make card-preview`, never drawn
# onto the site by `make page-cards`. Remove a model here to publish it.
preview_only: [sponsor]

# Where site paths such as /static/… live in the repository.
site_root: assets

# Pages are written in English unless listed here (path below content/).
page_lang:
  terms: de

recipes:
  blog-post:
    category: news
    headline: title
  masterclass:
    category: masterclass
    headline: title
    speakers: trainer
    kicker_from: hours
    event: masterclasses
    day_field: date
  keynote:
    category: keynote
    headline: title
    speakers: speaker_name
  call-for-proposals:
    category: page
    headline: title
  financial-aid:
    category: page
    headline: title
  standard-page:
    category: page
    headline: title
  media-kit:
    category: page
    headline: title
  # Thank-you card: tier as kicker, the sponsor's logo as the hero.
  # verified: the 2025 thank-you banners (assets/static/media/thank_you_banners).
  sponsor:
    category: sponsor
    headline_text: {en: "Thank you for your support!"}
    kicker: type
    sponsor_logo: logo

# `make sponsor-cards-upload` (run by hand, never in CI): every page of this
# model gets its card in every format of brand.yaml, uploaded into its own
# subfolder of this Google Drive folder as <slug>/<slug>_<format>.png.
drive_upload:
  model: sponsor
  folder: 18KiFSiloH8L775Ak7agBA26mu33Ooyk2
