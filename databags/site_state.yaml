# ──────────────────────────────────────────────────────────────
# Current-conference state (single, always-on)
# ──────────────────────────────────────────────────────────────#
# The site has one always-conference front page (no recap mode),
# so there is no active/inactive switch. This file holds the
# current-conference context read by the archive funnel-CTA
# (templates/macros/funnel-cta.html) on talk / track / speaker /
# archive-edition / topic-hub pages: a persistent "tickets on sale"
# band pointing archive traffic at the current conference.
#
# The funnel-CTA renders whenever `headline` is non-empty; clear it
# to hide the band (e.g. between cycles before the next dates lock).
# ──────────────────────────────────────────────────────────────

year: 2027

# ──────────────────────────────────────────────────────────────
# Featured edition — the newest *completed* edition
# ──────────────────────────────────────────────────────────────#
# Its pages already sit at their permanent /archive/{year}/ URLs
# like every past edition. Nothing structural keys off this block:
# URLs, canonical tags, the Pretalx-code 301 stubs, the breadcrumb
# trail and the JSON-LD are untouched — eventStatus stays
# EventCompleted, because the edition really is over.
#
# It changes only the framing: the "Archive" banner becomes a
# "latest edition" band and the "(Archive)" title suffix is
# dropped, for as long as the edition is still being actively
# promoted (recordings going online, recap posts).
#
# To retire the promotion and let the year render as a plain
# archive edition, clear `year` below. That one edit flips every
# surface back — no template change.
featured_edition:
  year: 2026
  badge: "Latest edition"
  note: "Recordings from PyCon DE & PyData 2026 are now online."

headline: "PyCon DE — tickets on sale"
sub: "Takes place at HCC Heidelberg, 20–22 April 2027."
tickets_url: /buy-ticket/
tickets_label: "Get your ticket"
early_bird_until: "10 February 2027"
