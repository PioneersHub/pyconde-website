display: true
# ──────────────────────────────────────────────────────────────
# Sponsoring page — booth photo grid (/sponsoring/)
# ──────────────────────────────────────────────────────────────
#
# Rendered by templates/macros/photo-grid.html. Two columns on wide
# screens, one on phones; any number of photos works.
#
# display    — false hides the whole section without editing templates
# title      — heading above the grid (optional)
# teaser     — one line below the heading (optional)
# image_dir  — where the files live, as a path from the site root
# images     — shown in the order listed; each entry:
#   file     — filename inside image_dir (required)
#   alt      — what the photo shows, for screen readers (required)
#   caption  — short line under the photo (optional)
#
# Add a photo:   put the file in assets/static/media/sponsoring/,
#                then add an entry below.
# Reorder:       move the entries.
# Remove:        delete or comment out the entry (and the file, if
#                nothing else uses it).
#
# Photo guidelines:
#   - Landscape 3:2 (e.g. 1280×853). Tiles are cropped to 3:2, so
#     other shapes lose their edges.
#   - JPEG, long edge ~1280px, ideally under 200 KB.
#   - Filenames describe the format, not the company: sponsored-talk.jpg,
#     booth-crowd.jpg. Lowercase.
#   - Captions and alt text name the format, never a sponsor.
#
# tests/test_sponsoring_gallery.py fails if a file is missing or an
# entry has no alt text.
# ──────────────────────────────────────────────────────────────

title: On stage and on the floor
teaser: >
  Present your work in a sponsored talk, join a panel discussion, and
  meet practitioners who build with Python every day at your booth.
image_dir: /static/media/sponsoring

images:
  - file: sponsored-talk.jpg
    alt: A speaker at the lectern in front of a large screen showing Python code
    caption: Sponsored talks — your speaker slot in the programme
  - file: panel.jpg
    alt: Panellists in red armchairs in conversation on stage
    caption: Panels — share the stage with the community
  - file: booth-crowd.jpg
    alt: A crowd of attendees gathered around a sponsor booth in the venue foyer
    caption: Booths — draw a crowd between sessions
  - file: booth-conversation.jpg
    alt: An attendee in conversation with a sponsor team member at their booth
    caption: Booths — one-on-one conversations with practitioners
