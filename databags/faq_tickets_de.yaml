sections:
# ############################################################################################
# TICKETS
# ############################################################################################
- name: Tickets
  id: tickets
  order: 3
  display: true
  qa:
  - id: tickets-english
    section: tickets
    question: Ich bevorzuge die FAQs auf Englisch
    answer: Zum Link unten wechseln.
    display: true
    link: /faqs#tickets
    link_display: Ticket-FAQs auf Englisch
    order: 0
  - id: when-are-you-going-to-start-selling-the-tickets
    section: tickets
    question: Wann beginnt der Ticketverkauf?
    answer: Der Ticketverkauf startet am 21. Oktober 2026 um 12:00 Uhr CEST.
    display: true
    order: 1
  - id: on-site-tickets-pricing
    section: tickets
    question: Vor-Ort-Tickets
    answer: |
      <p>Jeder 3-Tages-Pass gehört zu einer von vier Editionen. Die Preise steigen zu veröffentlichten Terminen und Kontingenten; eine geschlossene Edition öffnet nie wieder. Alle Preise in EUR inkl. MwSt.</p>
