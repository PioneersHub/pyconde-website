      <tr><td>Start</td><td>21. Oktober 2026, 12:00 Uhr CEST</td><td>wenn Edition I ausverkauft ist, spätestens am 4. November 2026</td><td>10. Februar 2027, Speaker werden bekannt gegeben</td><td>3. März 2027, Programm veröffentlicht</td></tr>
      <tr><td>Kontingent</td><td>150 Tickets</td><td>bis 10. Februar</td><td>bis 3. März</td><td>bis ausverkauft</td></tr>
