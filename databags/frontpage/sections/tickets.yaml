display: true
# Tickets CTA section
#
# Kept in sync with databags/tickets.yaml by `make flip-pricing` /
# `make sync-pricing` (utils/flip_pricing.py). Do not hand-edit
# `period` or `current_drop` — edit the editions and tiers in
# tickets.yaml and run the flipper.
#
# title        – section heading
# body         – short description paragraph; must stay true in every
#                edition, so it names no edition and no price
# period       – the edition on sale (an edition id from tickets.yaml)
# current_drop – one line for the edition on sale: name, 3-day standard
#                price, size if set, and how long it runs. Never shows
#                a later edition's price.
# link_text    – button label
# link_url     – button destination

title: "Tickets"
body: >
  Four editions, four limited shirts. Every three-day pass belongs to
  the edition on sale the day you buy. Prices only step up from edition
  to edition, so the earlier you join, the less you pay.
  PyCon DE sells out every year.
period: early
current_drop: "Current drop: Edition I: Early Bird 690 €, 150 available until 4 Nov"
link_text: "Get your ticket"
link_url: /buy-ticket/
