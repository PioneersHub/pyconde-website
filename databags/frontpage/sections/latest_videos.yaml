display: true
# ──────────────────────────────────────────────────────────────
# Front-page Latest Videos section
# ──────────────────────────────────────────────────────────────#
# Surfaces the newest conference recordings on the front page. The
# macro (templates/macros/latest-videos.html) walks the current
# /talks + every /archive/{year}/talks, keeps talks with a
# youtube_id (not do_not_record), and orders by edition year first,
# then by upload date within an edition.
#
# No per-video curation needed — it auto-refreshes as
# utils/sync_recordings.py attaches new recordings.
#
# Whether the section renders at all is set in
# databags/frontpage/config.yaml.
# ──────────────────────────────────────────────────────────────

section_title: "Latest videos"
# Five cards = exactly one full row (see .latest-videos__card CSS).
count: 5
see_all_text: "See all videos"
see_all_url: /archive/2026/
