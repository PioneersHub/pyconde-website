display: true
# ──────────────────────────────────────────────────────────────
# Front-page Sprints, Hackathons & Initiatives section
# ──────────────────────────────────────────────────────────────
# Dense info blocks, one per initiative, each linking to its
# subpage. Rendered by templates/macros/initiatives.html.
#
# Block schema:
#   title     – block heading
#   when      – date line
#   body      – one or two sentences
#   committed – optional list of confirmed projects/events:
#                 name, url, logo (optional, path under /static/)
#   links     – list of {text, url}; the first renders as the primary link
#
# Whether the section renders at all is set in
# databags/frontpage/config.yaml.
# ──────────────────────────────────────────────────────────────

section_title: "Sprints, Hackathons & Initiatives"
section_teaser: "Two more days after the conference — build, contribute and connect in Heidelberg."

blocks:
  - title: "Sprints"
    when: "Fri–Sat, 23–24 April 2027"
    body: "Two days of open-source hacking with project maintainers — first contribution or long-standing issue, there's room for everyone."
    committed:
      - name: "scikit-learn"
        url: https://scikit-learn.org/
        logo: /static/media/sprints/scikit-learn.svg
      - name: "spaCy"
        url: https://spacy.io/
        logo: /static/media/sponsors/spacy_logo_blue.svg
      - name: "Project Jupyter"
        url: https://jupyter.org/
        logo: /static/media/sprints/jupyter.svg
    links:
      - text: "Sprint details"
        url: /sprints/
      - text: "Propose a sprint project"
        url: /sprints/#propose-a-sprint-project

  - title: "Hackathons"
    when: "Fri–Sat, 23–24 April 2027"
    body: "Community-run hackathons alongside the sprints, open to everyone."
    committed:
      - name: "CHiLI — Community Hackathon in Linguistics & Informatics"
        url: /satellite-events/chili/
    links:
      - text: "Hackathon details"
        url: /satellite-events/#hackathons
      - text: "Apply to run a hackathon"
        url: /satellite-events/#propose-a-satellite-event

  - title: "More initiatives"
    when: "Mon, 19 April 2027 & around the conference"
    body: "A free Django Girls workshop on the masterclass day, PyLadies activities and networking, and more community events."
    committed:
      - name: "Django Girls Workshop"
        url: /satellite-events/#django-girls-workshop
        logo: /static/media/sponsors/djangogirls-logo.svg
      - name: "PyLadies at PyCon DE"
        url: /satellite-events/#pyladies-at-pycon-de
        logo: /static/media/initiatives/pyladies.png
    links:
      - text: "All satellite events"
        url: /satellite-events/
