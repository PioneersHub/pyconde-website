# ──────────────────────────────────────────────────────────────
# Front page — section order + display
# ──────────────────────────────────────────────────────────────#
# The single place to manage which sections appear on the front
# page and in what order. Each entry:
#   id      — stable key; maps to databags/frontpage/sections/<id>.yaml (texts)
#             and a branch in templates/macros/homepage.html. Exception:
#             a section file with `type: announcement` needs no branch.
#   display — true/false; set false to drop the section from the
#             page without editing templates.
#   anchor  — optional URL fragment; the section is reachable at /#<anchor>
#             (e.g. /#key-dates). Omit it and the section gets no anchor.
#
# To reorder: move the line. To hide: display: true.
#
# A section renders iff this `display` is true AND the matching
# databags/frontpage/sections/<id>.yaml has `display` != false (both default true).
#
# 2027 launch: only the focus sections are visible (intro, keydates,
# latest_videos, latest_blog, newsletter).
# Toggle the others on as the cycle progresses.
# ──────────────────────────────────────────────────────────────

sections:
  - id: intro
    anchor: intro
    display: true
#
  - id: motto
    anchor: motto
    display: false
#
  - id: why_attend
    anchor: why-attend
    display: true
#
  - id: latest_blog
    anchor: latest-blog
    display: true
#
  - id: masterclasses-call
    anchor: masterclasses-call
    display: true
#
  - id: newsletter
    anchor: newsletter
    display: true
#
  # Hand-curated video shelf (pretalx codes in
  # sections/featured_videos.yaml), directly above the automatic
  # latest_videos shelf.
  - id: featured_videos
    anchor: featured-videos
    display: true
#
  # Directly below "Stay in the Loop": that section promises new talk
  # recordings, this one shows them.
  #
  - id: latest_videos
    anchor: latest-videos
    display: true
#
  - id: about
    anchor: about
    display: true
#
  - id: sponsoring
    anchor: sponsoring
    display: true
#
  - id: programme_status
    anchor: programme-status
    display: false
# 
  - id: keydates
    anchor: key-dates
    display: true
 #
  - id: topics
    anchor: topics
    display: false
#
  - id: keynotes
    anchor: keynotes
    display: false
#
  - id: featured
    anchor: featured
    display: false
#
  - id: satellite_events
    anchor: satellite-events
    display: false
#
  - id: masterclasses
    anchor: masterclasses
    display: false
 #
  - id: past_editions
    anchor: past-editions
    display: true
#
  - id: tickets
    anchor: tickets
    display: false
#
  - id: sponsors
    anchor: sponsors
    display: false
