# ──────────────────────────────────────────────────────────────
# Prefix rewrites — the hosting layer's redirect rules
# ──────────────────────────────────────────────────────────────#
# This is the third redirect layer in the site, and the only one
# that produces real HTTP 301s:
#
#   1. databags/redirects.yaml      exact paths, rendered as HTML
#                                   meta-refresh pages by Lektor
#   2. migrate_pretalx_slugs.py     per-talk code -> slug, same
#                                   HTML meta-refresh mechanism
#   3. this file                    prefix rewrites, applied by the
#                                   host, covering every URL below
#                                   a prefix
#
# Layers 1 and 2 also emit nginx/Caddy snippets into site-config/,
# but that directory is gitignored and no workflow consumes it —
# in production those redirects are the HTML pages, nothing else.
# Layer 3 is different: utils/generate_routing_config.py turns this
# file into a bucket website configuration that the host actually
# applies (see .github/workflows/routing-config.yml).
#
# `{featured_edition}` resolves from databags/site_state.yaml ->
# featured_edition.year. Pointing /latest/ at the next edition is
# therefore a one-line change in that file, not here.
#
# Prefix rules are recursive: /latest/talks/some-slug/ redirects to
# /archive/2026/talks/some-slug/ without enumerating anything.
# ──────────────────────────────────────────────────────────────

prefix_redirects:
  - from: /latest/
    to: /archive/{featured_edition}/
    status: 301
    note: Stable, shareable entry point for the most recent completed edition.

# The S3 website configuration is replaced wholesale by
# `aws s3api put-bucket-website`, so these documents have to travel
# with the routing rules or applying them would break the site.
# The generator prefers whatever the bucket already has (via
# `--merge`) and falls back to these values.
website:
  index_document: index.html
  error_document: 404.html
