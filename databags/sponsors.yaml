      - name: Lidl Stiftung & Co. KG
        id: lidl
        headline: Lidl Stiftung & Co. KG
        description: |
          Lidl is a part of the Schwarz Group with headquarters in Neckarsulm,
          Germany, and is one of the leading food retailers in Germany and Europe. Lidl
          currently operates around 12,350 stores and more than 220 goods distribution
          and logistics centers in 31 countries and employs around 375,000 people.<br/><br/>

          At Lidl, we value an optimal price-performance ratio for our customers. Simplicity
