    id: community-partners
    group: Partners
    sponsors:
      - name: appliedAI Institute for Europe gGmbH
        id: applied-ai-institute
        headline: appliedAI Institute for Europe gGmbH
        description: |
          The appliedAI Institute for Europe strengthens the European AI ecosystem by
          providing AI knowledge and fostering research. Founded as a non-profit
          subsidiary of the appliedAI Initiative, the Institute aims to be part of and
          build a trustworthy AI community. Supported by the KI-Stiftung Heilbronn, it
          offers formats for networking and collaboration.
        website: https://www.appliedai-institute.de/en/
        logo: /static/media/sponsors/appliedAI_horizontal_rgb_RZ.svg
        scale: null
      - name: Hessian AI
        id: hessian_ai
        headline: hessian.AI – the Hessian Centre for Artificial Intelligence
        description: |
          The Hessian Center for Artificial Intelligence is an association of 13 Hessian
          universities and pursues the goal of conducting cutting-edge research with
          concrete practical relevance. As a research and innovation center, hessian.AI
          promotes the transfer of results to business and society through the training
          of AI talent, the promotion of start-ups and cooperation with companies.
        website: https://hessian.ai
        logo: /static/media/sponsors/hessian.AI-vertical.svg
        scale: null
      - name: PyLadies Südwest
        id: pyladies_suedwest
        headline: PyLadies Südwest
        description: |
          PyLadies is an international mentorship group with a focus on helping more
          women become active participants and leaders in the Python open-source
          community. Our mission is to promote, educate and advance a diverse Python
          community through outreach, education, conferences, events and social
          gatherings. PyLadies also aims to provide a friendly support network for women
          and a bridge to the larger Python world. Anyone with an interest in Python is
          encouraged to participate! PyLadies Südwest meet regularly. There is usually a
          talk and a hands-on session over a Python topic and sometimes we do a book
          club meeting. Anyone is welcome to propose topics that wishes to learn and
          give a talk.
        website: https://www.meetup.com/de-DE/pyladies-suedwest/
        logo: /static/media/sponsors/pyladies-suedwest.svg
        scale: scale-70
      - name: PyLadies Hamburg
        id: pyladies_hamburg
        headline: PyLadies Hamburg
        description: |
          We're the Hamburg chapter of PyLadies, an international mentorship group for
          marginalized genders, such as but not limited to non-binary people, trans
          people, and women in tech. <br/><br/> We host monthly events, talks, workshops
          and study groups where you can meet other pythonistas and learn more about
          programming, data science, web development, and more. All skill levels
          welcome!
        website: https://hamburg.pyladies.com/
        logo: /static/media/sponsors/pyladies-hamburg.svg
        scale: scale-90
      - name: PyLadies Berlin
        id: pyladies_berlin
        headline: PyLadies Berlin
        description: |
          PyLadies is an international mentorship group for marginalized genders, such
          as but not limited to non-binary people, trans people, and women in tech, with
          a focus on helping our community become active participants and leaders in the
          Python open-source community. All skill levels are welcome!
        website: https://berlin.pyladies.com/
        logo: /static/media/sponsors/pyladies-berlin.png
        scale: scale-70
      - name: PyData Berlin
        id: pydata_berlin
        headline: PyData Berlin
        description: |
          PyData Berlin is a thriving hub for data science, machine learning, and AI
          enthusiasts in one of Europe’s leading tech capitals. As part of the global
          PyData network, it brings together professionals, researchers, and open-source
          contributors to share knowledge, foster collaboration, and explore innovative
          solutions. With Berlin’s dynamic startup scene, academic institutions, and
          vibrant international community, PyData Berlin serves as a cornerstone for
          advancing AI and data-driven technologies while promoting inclusivity and
          open-source excellence.
        website: https://berlin.pydata.org/
        logo: /static/media/sponsors/pydata-berlin.svg
        scale: null
      - name: PyData Südwest
        id: pydata_suedwest
        headline: PyData Südwest
        description: |
          PyData Südwest is a dynamic community connecting data science and AI
          enthusiasts across Heidelberg, Mannheim, Karlsruhe, and Heilbronn. This
          region, renowned for its thriving tech ecosystem and innovation hubs, plays a
          pivotal role in advancing AI research and applications in Germany. PyData
          Südwest fosters collaboration and knowledge exchange through engaging meetups
          and events, creating a welcoming space for professionals, researchers, and
          students to share ideas, explore cutting-edge technologies, and strengthen the
          local AI and open-source community.
        website: https://www.meetup.com/pydata-suedwest/
        logo: /static/media/sponsors/pydata-suedwest-blue-sm.svg
        scale: null
      - name: PyData Rhein-Main
        id: pydata_rhein_main
        headline: PyData Rhein-Main
        description: |
          PyData Rhein-Main unites the vibrant data science and AI community across
          Frankfurt, Darmstadt, and Wiesbaden, regions known for their strong tech
          industry, academic excellence, and innovation hubs. As part of the global
          PyData network, it offers a platform for professionals, researchers, and
          enthusiasts to connect, share knowledge, and collaborate on cutting-edge
          topics in AI, machine learning, and open-source tools. Through regular meetups
          and events, PyData Rhein-Main fosters a supportive environment for learning,
          networking, and driving innovation in the heart of Germany.
        website: https://www.meetup.com/pydata-frankfurt/
        logo: /static/media/sponsors/pydata-rhein-main-blue-sm.svg
        scale: null
      - name: DjangoGirls
        id: djangogirls
        headline: DjangoGirls
        description: |
          DjangoGirls is a global initiative dedicated to empowering women and
          non-binary individuals to break into tech by learning programming through
          Django, a popular Python web framework. By hosting free, beginner-friendly
          workshops, DjangoGirls provides a supportive and inclusive environment for
          participants to build their first web applications, gain confidence in coding,
          and connect with a welcoming community of mentors and peers. With events held
          in cities around the world, DjangoGirls is making tech more accessible and
          fostering diversity in the industry.
        website: https://djangogirls.org/de/darmstadt/
        logo: /static/media/sponsors/djangogirls-logo.svg
        scale: null
      - name: spaCy
        id: spacy
        headline: spaCy
        description: |
          Explosion is a software company specializing in developer tools for AI and
          Natural Language Processing. We’re the makers of spaCy, one of the leading
          open-source libraries for advanced NLP and Prodigy, an annotation tool for
          radically efficient machine teaching.
        website: https://spacy.io/
        logo: /static/media/sponsors/spacy_logo_blue.svg
        scale: null
  - name: Technical Partners
    id: technical-partners
    group: Partners
    sponsors: []
