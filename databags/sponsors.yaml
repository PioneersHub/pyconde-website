# 2027 sponsors. Entries are reused from databags/sponsors_2026.yaml when a
# sponsor is confirmed; that file is the frozen 2026 lineup and stays untouched.
#
# Each tier sets how it renders in the sponsor wall (macros/sponsor.html):
#   logo_size  xl | lg | md | sm — logo box size; the tier name itself is not shown
#   group      a divider label — tiers sharing the same label are collected into
#              one small-logo row under that label, in order of first appearance
#
# past_editions lists the frozen lineups shown as a compact strip below the
# current sponsors. Sponsors already in this file are left out of the strip.
# Past logos render as dark silhouettes so every logo reads on the light
# section background. tonal_logos lists the ids whose logo is a filled shape
# with knocked-out text (white on a box or circle): a silhouette turns those
# into a solid blob, so they render in greyscale instead.
#
# Order of the moving line: the curated `featured` ids come first, in the
# order listed. They are picked by brand weight — how widely the name is
# known — not by the tier they bought: a household name that was Silver
# belongs here. Everyone else follows automatically: best tier ever held
# (position in `tier_order`, which must name every tier id used in the past
# lineups), then more editions, then most recent edition.
past_editions:
  title: Sponsors of past editions
  bags:
    - sponsors_2026
    - sponsors_2025
  featured:
    - merck
    - meta
    - lufthansa-technik
    - eon
    - rewe
    - jetbrains
    - zeiss
    - schwaebisch_hall
    - snowflake
    - dmtech
    - deepl
    - vattenfall
    - rlboo
    - munich-digital
    - okta
    - redis
    - anaconda
    - vonage
    - blueyonder
    - pydantic_logfire
    - aleph-alpha
  tier_order:
    - keystone
    - diamond
    - platinum
    - gold
    - silver
    - community-sponsors
    - institutional-sponsors
    - institutional-partners
    - diversity-sponsors
    - community-partners
    - technical-partners
  tonal_logos:
    - exocad
    - rewe
    - eps
    - pyladies_suedwest
    - pyladies_berlin
    - probably_private
    - beauhurst

types:
  - name: Keystone
    id: keystone
    logo_size: xl
    sponsors: []
  - name: Platinum
    id: platinum
    logo_size: lg
    sponsors:
      - name: Merck
        id: merck
        headline: Merck
        description: |
          Merck is a leading science and technology company that uniquely combines three
          specialized, innovation-driven businesses: Life Science, Healthcare, and
          Electronics. Using our multi-industry expertise, we help to address a broad range
          of global challenges.<br/><br/>

          From providing products for scientific research and biotech production to therapies
          against serious diseases to high-tech materials for computer chips and displays
          – we work to make a positive impact on millions of peoples lives every day.
          In 2023, 63,000 colleagues in 65 countries generated sales of 21 billion euros.
          Headquartered in Darmstadt, Germany, we are publicly listed and have been
          majority-owned by the founding family since 1668.
        website: https://www.merckgroup.com/en
        logo: /static/media/sponsors/merck.svg
        scale: null
      - name: QuantCo
        id: quantco
        headline: QuantCo
        description: |
          QuantCo is an Applied AI company. We leverage expertise in engineering, AI research,
          and economics to help organisations turn their data into critical strategic decisions
          with significant economic impact.<br/><br/>

          Founded by four PhDs from Harvard and Stanford, we're now over 250 technical experts
          working with some of the largest financial, healthcare, automotive, and e-commerce
          companies in Europe & the US.<br/><br/>

          Our product lines include enterprise agents, cancer detection platforms, predictive
          health suites, algorithmic pricing engines, data-driven claims management &
          high-dimensional forecasting solutions.<br/><br/>

          Our team operates from major hubs in the US and Europe, including Berlin, Munich,
          Zurich, London, Boston, and San Francisco.
        website: https://www.quantco.com
        logo: /static/media/sponsors/Q_quantco_BLACK.svg
        scale: null
  - name: Gold
    id: gold
    logo_size: md
    sponsors: []
  - name: Silver
    id: silver
    logo_size: sm
    sponsors:
      - name: Lidl Stiftung & Co. KG
        id: lidl
        headline: Lidl Stiftung & Co. KG
        description: |
          Lidl is a part of the Schwarz Group with headquarters in Neckarsulm,
          Germany, and is one of the leading food retailers in Germany and Europe. Lidl
          currently operates around 12,350 stores and more than 220 goods distribution
          and logistics centers in 31 countries and employs around 375,000 people.<br/><br/>

          At Lidl, we value an optimal price-performance ratio for our customers. Simplicity
          and process orientation determine the daily activities in the stores, the regional
          distribution centers and the national headquarters.
        website: https://info.lidl/
        logo: /static/media/sponsors/lidl.svg
        scale: null
      - name: Bürgerwerke
        id: buergerwerke
        headline: Bürgerwerke
        description: |
          Bürgerwerke empowers people to implement the energy transition as a community.<br/><br/>

          For over ten years, we have been one of the few genuine green electricity providers
          in Germany. We have since grown into Germany’s largest network of energy
          cooperatives. With more than 80,000 people in over 150 energy cooperatives, we are
          working toward a single goal: putting the energy transition in the hands of the
          people.
        website: https://buergerwerke.de/
        logo: /static/media/sponsors/buergerwerke.svg
        scale: null
      - name: Bausparkasse Schwäbisch Hall AG
        id: schwaebisch_hall
        headline: Bausparkasse Schwäbisch Hall AG
        description: |
          Schwäbisch Hall is the largest German Bausparkasse (Building society) and one of
          the leading providers of housing financing. A team of around 6,800 people works
          closely with the German Cooperative Banks to create and preserve homes for the
          customers with more than 7 million contracts. The company sees Data Science and
          AI as key drivers of productivity, creativity and job satisfaction, while
          maintaining their core focus on human-centered business.
        website: https://www.schwaebisch-hall.de/
        social:
          - https://www.instagram.com/bausparkasseschwaebischhall
          - https://www.linkedin.com/company/bausparkasse-schwabisch-hall/
        logo: /static/media/sponsors/SH_Logo_Box_links.svg
        scale: null
  - name: Community Sponsors
    id: community-sponsors
    logo_size: sm
    sponsors:
      - name: Python Academy
        id: python-academy
        headline: Python Academy
        description: |
          Python Academy is a specialized Python training company. It offers open
          courses for individuals as well as customized on-site courses for companies
          and institutes. It covers a wide range of Python topics from introductory to
          advanced, Python for scientists and engineers, big data, web development, code
          optimization and many more. In addition to training, it consults companies
          that migrate to Python and develop high-quality Python software often in
          combination with training. The special expertise of the academy is scientific
          and technical software development with Python.
        website: https://www.python-academy.com
        logo: /static/media/sponsors/python-academy.svg
        scale: null
      - name: Bruhin Software
        id: bruhin-software
        headline: Bruhin Software
        description: |
          Bruhin Software is a freelance company founded by Freya Bruhin and based in
          Winterthur, Switzerland. Freya Bruhin is actively involved in a range of
          open-source software projects while maintaining a pragmatic approach, always
          choosing the right tool for the job and the specific circumstances. Bruhin
          Software offers consulting, training, and development services. Freya Bruhin
          is an experienced software developer whose primary focus is on consulting and
          training in Python, including both fundamentals and advanced language
          features, in graphical user interface development with PyQt and PySide / Qt
          for Python, and in testing with pytest. With extensive expertise in Python,
          PyQt/PySide, and pytest, Freya Bruhin has worked across a wide variety of use
          cases and technical challenges involving these technologies. Bruhin Software
          supports clients in getting started, overcoming technical roadblocks, and
          applying established best practices.
        website: https://bruhin.software
        logo: /static/media/sponsors/bruhinsw.svg
        scale: scale-80
      - name: Academis
        id: academis
        headline: Academis Dr. Kristian Rother
        description: |
          Dr. Kristian Rother is developing Python since 2000. His training label
          Academis guides developers from programming fundamentals to professional
          software engineering practices. During courses, participants may expect a
          strong focus on hands-on coding exercises and interaction that enhances
          retention and keeps trainings enjoyable. Courses by Academis are exclusively
          in-person. In development projects, Kristian enjoys unmessing flaky test
          suites, refactoring legacy codebases and finding structure where the AI
          didn't.
        website: https://www.academis.eu
        logo: /static/media/sponsors/academis_logo_bg.svg
        scale: null
      - name: Tereza Iofciu
        id: tereza-iofiu
        headline: Tereza Iofciu
        description: |
          Tereza Iofciu is a data and AI expert, leadership coach, and PSF Fellow with
          15+ years of experience leading data and product teams at neuefische, FREE
          NOW, and New Work (XING). She helps professionals lead and adapt in the age of
          AI through her [Data Diplomat
          Framework™](https://docs.google.com/document/d/1kpaP-pIDb2XpYUninnShK6ileKmSoaWgGz1vYq9n4SY/edit?tab=t.0),
          bridging technical depth with human leadership.
          Her focus this year is on creating and facilitating highly interactive
          workshops for both non-technical and technical topics.
        website: https://www.terezaiofciu.com/
        logo: /static/media/sponsors/terezaiofciu.svg
        scale: null
  - name: Institutional Sponsors
    id: institutional-sponsors
    group: Institutional Sponsors
    sponsors:
      - name: Python Softwareverband e.V.
        id: pysv
        headline: Python Softwareverband e.V.
        description: 'The Python Software Verband (PySV) is an association dedicated to
      supporting and promoting the Python programming language and its community across
      German-speaking countries. As a central hub for Python enthusiasts, professionals,
      and organizations, PySV fosters collaboration, knowledge exchange, and the responsible
      use of open technologies.<br/><br/>

      The association advocates for the visibility and sustainable growth of the Python
      ecosystem by organizing events, enabling networking opportunities, and representing
      community interests in public and professional forums. PySV also supports educational
      initiatives, local meetups, and open-source contributions—helping to create
      a vibrant, inclusive, and future-oriented Python community.<br/><br/>

      Through its close collaboration with international partners and local communities
      alike, the Python Software Verband plays a vital role in strengthening Python’s
      presence and impact in Germany, Austria, and Switzerland.'
        website: https://pysv.org
        logo: /static/media/sponsors/pysv.svg
        scale: null
      - name: Pioneers Hub
        id: pioneershub
        headline: 'Pioneers Hub: Driving Innovation, Empowering Tech Communities'
        description: 'Pioneers Hub is a non-profit organization committed to advancing
      innovation and strengthening the fabric of tech communities. With a strong focus
      on artificial intelligence, software, and data, Pioneers Hub connects professionals,
      enthusiasts, and domain experts to foster meaningful exchange and interdisciplinary
      collaboration.<br/><br/>

      Through its community-driven approach, the organization provides platforms for
      dialogue, learning, and co-creation—empowering individuals and organizations
      to better understand, adopt, and shape emerging technologies. Pioneers Hub actively
      supports open-source initiatives, promotes diversity and inclusion, and encourages
      a culture of curiosity, excellence, and responsible innovation.<br/><br/>

      By nurturing ecosystems where experimentation is welcome and expertise is shared,
      Pioneers Hub helps communities keep pace with rapid technological change and
      contributes to building a more sustainable, open, and innovative future.<br/><br/>

      Pioneers Hub supports PyCon DE, PyData Berlin, PyData Südwest, PyData
      RheinMain, PyLadies Südwest and other high tech communities.'
        website: https://pioneershub.org
        logo: /static/media/sponsors/pioneershub.svg
        scale: null
