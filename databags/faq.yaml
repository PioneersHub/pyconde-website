# ############################################################################################
# GENERAL
# ############################################################################################
- name: General
  id: general
  order: 2
  display: true
  qa:
  - id: newsletter
    section: milestones
    question: How I can I stay up to date?
    answer: For major milestones we send out a newsletter. Please subscribe to our
      newsletter.
    link: /newsletter/
    link_display: Go here to subscribe our newsletter
    display: true
    order: 1
  - id: what-s-the-conference-language
    section: general
    question: What's the conference language?
    answer: The conference is all in English.
    display: true
    order: 2
  - id: missed-deadline
    section: general
    question: I missed a deadline. Will an email help to make up for it?
    answer: |
      We are sorry to hear that, and we understand that things do not always go to plan.

      However, deadlines apply equally to everyone, so we cannot make individual exceptions or extend a deadline by email. This keeps the process fair for everyone who submitted on time.

      Our team truly appreciates your interest and looks forward to your punctual submission next year. All upcoming dates are listed in the conference milestones.
    link: '#important-dates'
    link_display: Conference milestones
    display: true
    order: 3

# ############################################################################################
# TICKETS
# ############################################################################################
- name: Tickets
  id: tickets
  order: 3
  display: true
  qa:
  - id: tickets-deutsch
    section: tickets
    question: Gibt es die Ticket FAQs auf Deutsch? (Ticket FAQs in German?)
    answer: Ja. Viele Unternehmen bevorzugen den Einkauf auf Deutsch, daher stellen wir die Ticket-FAQs auch in deutscher Sprache bereit. Der Link führt direkt zu den deutschen Ticket-FAQs.
    display: true
    link: /faqs-de/
    link_display: Deutschsprachige Ticket-FAQs
    order: 0
  - id: when-are-you-going-to-start-selling-the-tickets
    section: tickets
    question: When are you going to start selling the tickets?
    answer: Ticket sales open on 21 October 2026 at 12:00 CEST.
    display: true
    order: 1
  - id: on-site-tickets-pricing
    section: tickets
    question: On-Site tickets
    answer: |
      <p>Every three-day pass belongs to one of four editions. Prices step up on published dates and quotas; once an edition closes, it never reopens. All prices in EUR, incl. VAT.</p>
      <table>
      <tr><th colspan="5">Conference Pass On-Site (Tuesday–Thursday, 20–22 April 2027)</th></tr>
      <tr><td></td><td>Edition I: Early Bird</td><td>Edition II: Blind Bird</td><td>Edition III: Wise Bird</td><td>Edition IV: Late Bird</td></tr>
      <tr><td>Opens</td><td>21 October 2026, 12:00 CEST</td><td>when Edition I is gone, 4 November 2026 at the latest</td><td>10 February 2027, speakers announced</td><td>3 March 2027, schedule published</td></tr>
      <tr><td>Size</td><td>150 tickets</td><td>until 10 February</td><td>until 3 March</td><td>until sold out</td></tr>
      <tr><td>Standard</td><td>690 €</td><td>790 €</td><td>890 €</td><td>990 €</td></tr>
      <tr><td>Self-funded</td><td>450 €</td><td>500 €</td><td>550 €</td><td>625 €</td></tr>
      <tr><td>Student</td><td>275 €</td><td>300 €</td><td>325 €</td><td>375 €</td></tr>
      </table>
      <p>Each three-day pass includes the limited shirt of its edition.</p>
      <table>
      <tr><th colspan="2">Day Pass On-Site (on sale from 3 March 2027, no shirt)</th></tr>
      <tr><td>Standard</td><td>550 €</td></tr>
      <tr><td>Self-funded</td><td>300 €</td></tr>
      <tr><td>Student</td><td>200 €</td></tr>
      </table>
      <br>
      <table>
      <tr><th colspan="2">Masterclasses: Monday, 19 April 2027 (full day, small groups)</th></tr>
      <tr><td>until 10 February 2027</td><td>590 €</td></tr>
      <tr><td>until 2 March 2027</td><td>690 €</td></tr>
      <tr><td>from 3 March 2027</td><td>790 €</td></tr>
      </table>
      <p>Masterclasses are announced on an ongoing basis as trainers sign up.</p>
    link: /buy-ticket/
    link_display: Ticket page
    display: true
    order: 2
  - id: remote-tickets-pricing
    section: tickets
    question: Remote tickets
    answer: |
      <p>Remote tickets include all talks live and on demand.</p>
      <table>
      <tr><th colspan="3">Conference: 3-day remote tickets</th></tr>
      <tr><td></td><td>until 10 February 2027</td><td>from 11 February 2027</td></tr>
      <tr><td>Standard</td><td>190 €</td><td>240 €</td></tr>
      <tr><td>Self-funded</td><td>90 €</td><td>140 €</td></tr>
      <tr><td>Student</td><td>free 👇</td><td>free 👇</td></tr>
      </table>
      <p>All student registrations are reviewed and require approval. Please use your university email—social links are optional, but help us validate faster.</p>
    display: true
    order: 3
  - id: are-tickets-refundable
    section: tickets
    question: Are tickets refundable?
    answer: Any ticket is fully refundable until 2 April 2027, no questions asked.
    display: true
    order: 4
  - id: tickets-payment
    section: tickets-payment-methods
    question: What payments option do you offer?
    answer: |
      We accept:
      <ul>
      <li>
      Bank transfer [actually our preferred method]</li><li>
      Credit card (via Stripe)</li><li>
      PayPal (for non SEPA countries)</li>
      </ul>
      
      PayPal charges high fees, which is why we offer PayPal only for non-SEPA countries.
      Within SEPA (the European Single Euro Payments Area), a simple bank transfer is recommended.
    display: true
    order: 5
  - id: tickets-by-invoice
    section: tickets
    question: Can tickets be paid by invoice and bank transfer?
    answer: |
      Yes. Tickets can be purchased by **invoice** and paid via **bank transfer** through the ticket shop.  
  
      Please make sure to **download the invoice immediately after purchase** and ensure it is processed correctly by your bookkeeping or procurement department.  
      All funds must be received **within the stated payment term**; unpaid tickets will be canceled automatically.  
      **Conference tickets will be issued once payment has been processed on our side.**  
  
      Please note that while we understand there may be delays in internal procurement processes, the conference cannot accept any payment delays or provide additional paperwork, supplier onboarding, or custom processing for purchase systems.  
      If this is not feasible, we recommend completing the purchase via **credit card** instead.
    display: true
    order: 6
  - id: discounts-for-purchasing-multiple-tickets
    section: tickets
    question: Is there a package for purchasing multiple tickets at once?
    answer: Teams of five or more, please contact sponsoring for the Silver package.
    link: /sponsoring/
    link_display: Contact sponsoring
    display: true
    order: 4
  - id: purchase-orders-for-tickets
    section: tickets
    question: Can I sent you a purchase order for tickets?
    answer: |
      Unfortunately, **purchase orders are only accepted from sponsors**.  
      All other tickets must be purchased directly through the **ticket shop**.  
  
      If tickets need to be purchased by another department, please coordinate internally to complete the transaction through the ticket shop.  
      Purchase orders sent by email or fax **will not be processed**.  
      Procurement-based purchasing is available **exclusively to sponsors**.
    display: true
    order: 5
  - id: what-about-food-drinks-during-the-conference
    section: tickets
    question: What is included in terms of food and drinks during the conference?
    answer: |
      The conference ticket includes a light lunch buffet, coffee breaks, and light refreshments throughout the day.
    display: true
    order: 6
  - id: food-options-at-the-conference
    section: tickets
    question: Which food options are there?
    answer: |

     While every effort is made to provide a diverse selection, some options may be limited due to local conditions. The planned options include:
      <ul>
      <li>
      gluten-free</li><li>
      lactose-free</li><li>
      meat</li><li>
      vegan</li><li>
      vegetarian</li>
      </ul>

      All food will be labeled for allergens.
      
      We will conduct a representative survey before the conference to ensure an appropriate distribution of options.
    display: true
    order: 7
  - id: what-if-one-short-notice
    section: tickets
    question: What if one gets sick or has a (family) emergency just before the conference?
    answer: |
      Tickets can be re-assigned until two days before the conference.

      All on-site tickets do **include remote access**, so if one does not feel well one can
      still join remotely.
    display: true
    order: 8
  - id: tickets-invoice-correction
    section: tickets
    question: How can invoices be corrected?
    answer: |
      Invoice details can be updated in **self-service** through the ticket shop.  
      
      When changes are made, the system automatically issues a **credit note** for the original invoice and generates a **new corrected invoice**.
    display: true
    order: 9
  - id: conference-t-shirts
    section: tickets
    question: Are conference T-shirts included?
    answer: |
      Yes. Each three-day pass includes the shirt of its edition: four editions, four designs.

      Every edition is limited: the shirts are custom made in the exact number sold — no reprints, no sales, no shirts at the door.
      Sizes are final on **31 March 2027**; no changes or additions after that. Day passes do not include a shirt.
    display: true
    order: 999
  - id: t-shirt-editions
    section: tickets
    question: What is a T-shirt edition, and until when can I get one?
    answer: |
      <p>Every three-day pass belongs to one of four ticket editions, and each edition has its own T-shirt design. Your edition is the one on sale on the day you order, so the earlier you buy, the earlier your edition.</p>
      <table>
      <tr><th>Edition</th><th>On sale</th><th>T-shirt</th></tr>
      <tr><td>I: Early Bird</td><td>from 21 October 2026, 12:00 CEST — 150 tickets, until sold out (4 November 2026 at the latest)</td><td>Edition I design</td></tr>
      <tr><td>II: Blind Bird</td><td>after Edition I, until 10 February 2027</td><td>Edition II design</td></tr>
      <tr><td>III: Wise Bird</td><td>10 February – 3 March 2027</td><td>Edition III design</td></tr>
      <tr><td>IV: Late Bird</td><td>from 3 March 2027 until sold out</td><td>Edition IV design</td></tr>
      </table>
      <p><strong>Sizes are final on 31 March 2027, no changes or additions after that.</strong> The shirts are custom made in the exact number sold: there are no reprints and no shirts at the door. Day passes never include a shirt.</p>
      <p>Once an edition closes, it never reopens, so its shirt cannot be ordered later either.</p>
    display: true
    order: 999
  - id: conference-tshirt-size-change
    section: tickets
    question: Can I change my T-shirt size after ordering?
    answer: |
      Yes, until **31 March 2027**. You can adapt your personal information (name, contact details, etc.), but to change the **T-shirt size** you need to change your order.

      1. Go to your order page; you can find the link in your order confirmation. It looks like: https://pretix.eu/pysv/…/order/YOURORDERID/…/<br>
      2. Scroll to the bottom and select **"Change or cancel your order → Change order"** 
         (German: **"Bestellung stornieren oder umbuchen → Bestellung umbuchen"**)<br> 
      3. Select another T-shirt size and continue to complete the change.<br>
    display: true
    order: 999
  - id: what-is-the-right-ticket-to-buy
    section: tickets
    question: Which ticket category should be selected?
    answer: |
      The ticket category follows who pays for the ticket.

      **Standard:** the ticket is a business expense. It is paid or reimbursed by a company or organization, or booked by a freelancer — no exceptions. This includes:
      <ul>
      <li>
      Companies and organizational entities</li><li>
      Freelancers</li><li>
      Start-ups</li><li>
      Public sector employees</li><li>
      Private research institutes</li><li>
      Corporate R&D departments</li>
      </ul>

      **Personal:**
      <ul>
      <li>
      **Self-funded:** you pay out of your own private pocket, for example as a hobbyist, an enthusiast, or someone learning the language. Academic researchers and post-docs at public academic institutions also buy Self-funded.</li><li>
      **Student:** full-time students with a valid student ID at the time of the conference, whoever pays for the ticket.</li>
      </ul>

    display: true
    order: 10
  - id: do-you-offer-any-day-tickets
    section: tickets
    question: Do you offer any day tickets?
    answer: |
      Yes. **Day passes** go on sale on **3 March 2027**, once the schedule is published.
      Availability depends on overall ticket sales and venue capacity. Day passes do not include a shirt.
    display: true
    order: 10
  - id: social-event-tickets
    section: tickets
    question: Social Event tickets?
    answer: |
      Tickets for the Social Event can be purchased as an add-on to any on-site conference ticket from day one in our ticket shop.
      Please note that space is limited. Day pass holders can only add the Social Event to a day pass for the day it takes place.
    display: true
    order: 10
  - id: tickets-for-students
    section: tickets
    question: What about tickets for students?
    answer: |
      The Student ticket is available for anyone who holds a valid student ID at the time of the conference.
      The student ID must be presented upon first entry to the venue.

      Please note that if student status ends before the conference takes place, the Student ticket is not applicable.
      
      Eligibility is limited to full-time students. We cannot accept applications from part-time students who are completing their degree alongside full-time work. Part-time jobs to support your studies do not affect eligibility.
    display: true
    order: 11
  - id: tickets-vat
    section: tickets
    question: All ticket prices include VAT
    answer: |
      All ticket prices include 19% VAT.  

      The EU VAT reverse charge does **not apply**, as conferences are taxed in the host country.  
      Companies may apply for a VAT refund through the local tax authorities.
    display: true
    order: 11
  - id: order-limits
    section: tickets
    question: Order limits
    answer: 'Edition I: up to five tickets per order.'
    display: true
    order: 999
  - id: i-m-on-a-budget-and-cannot-afford-a-ticket
    section: tickets
    question: I’m on a budget and cannot afford a ticket.
    answer: |
      The conference offers a **Financial Aid and Scholarship Program** to support those who would otherwise be unable to attend.  
      Please check the program page for this year’s deadlines and details.
    link: /financial-aid/
    link_display: Financial Aid Program
    display: true
    order: 999
  - id: is-it-possible-to-purchase-individual-tickets-as-a-company
    section: tickets
    question: Is it possible for a company to purchase Self-funded Tickets?
    answer: |
      No. **Self-funded Tickets** are intended only for private individuals paying out of their own private pocket and for researchers at public academic institutions.
      Tickets purchased by a company or organization will be canceled.  
      Any reference to a company or organizational address in the invoice details is considered misuse and will also lead to cancellation.
    display: true
    order: 999
  - id: i-m-working-with-python-but-i-do-not-get-reimbursed-by-my-employer
    section: tickets
    question: I’m working with Python, but I do not get reimbursed by my employer.
    answer: |
      In this case, it is acceptable to purchase a **Self-funded Ticket**.
      Please ensure that no company or organizational information is included in the invoice details, as this would be considered misuse and may lead to cancellation.
    display: true
    order: 999
  - id: is-it-possible-to-purchase-student-tickets-as-a-company
    section: tickets
    question: Is it possible to purchase Student Tickets as a company?
    answer: Yes, a valid student-ID must be presented entering at the conference the first time.
    display: true
    order: 999
  - id: i-m-an-academic-researcher-which-one-is-the-right-ticket-for-me
    section: tickets
    question: I’m an academic researcher — which ticket should I choose?
    answer: |
      Academic researchers affiliated with **public academic institutions**—such as public universities, or research organizations like the **Max Planck** or **Helmholtz Institutes**—are eligible to purchase a **Self-funded Ticket**.

      This option is **not available** for researchers working in **private institutes**, **research companies**, or the **public sector**.

      Please note that, for logistical reasons, **Self-funded Tickets** do not display institutional affiliations on conference badges.  
      If showing your affiliation is important, consider purchasing a **Standard Ticket** instead.
    display: true
    order: 999
  - id: my-credit-card-is-not-working-are-there-alternative-payment-methods
    section: tickets
    question: My credit card is not working — are there alternative payment methods?
    answer: |
      Yes. In addition to credit card payments processed via **Stripe**, tickets can also be paid by **bank transfer** through the ticket shop.  
      Please select the bank transfer option during checkout.  
  
      All funds must be received within 10 working days and **at least two weeks before the conference**; unpaid tickets will be canceled automatically.  
      If issues persist with credit card payments, please contact your bank or try again later, as temporary authorization issues can occur.
    display: true
    order: 999
  - id: where-can-i-find-the-invoice
    section: tickets
    question: Where can I find the invoice?
    answer: |
      After completing the purchase, all relevant information and documents, including the **invoice**, will be sent by email from our ticket shop **Pretix**.
      The invoice email includes a link where the invoicing address can be added or edited.

      The invoicing address is often required by employers to claim VAT.
      Please ensure that the correct invoicing details (e.g., employer information) are entered **before the conference starts**.
      Changes to invoices cannot be made after this period.
    display: true
    order: 999
  - id: reselling-tickets
    section: tickets
    question: Can tickets be resold?
    answer: |
      Tickets are **personalized** and **reselling is not permitted**.  
      However, it is acceptable to purchase tickets on behalf of a friend, colleague, or subsidiary, provided proper reimbursement is handled privately.
    display: true
    order: 999
  - id: do-you-sell-tickets-at-the-conference
    section: tickets
    question: Do you sell tickets at the conference?
    answer: No.
    display: false
    order: 999
  - id: are-badges-transferable
    section: tickets
    question: Are badges transferable?
    answer: |
      No, badges issued are valid only for the person to whom the badge was assigned to.
    display: true
    order: 999
  - id: do-you-have-extra-discounted-tickets-for-sponsors
    section: tickets
    question: Can sponsors get additional tickets?
    answer: Yes, please contact sponsoring.
    link: /sponsoring/
    link_display: Link to sponsoring.
    display: true
    order: 999
  - id: return-ticket
    section: tickets
    question: How can a ticket be returned or canceled?
    answer: |
      Tickets can be canceled until **2 April 2027** directly through the ticket shop using the self-service option provided in the confirmation email.
      Please follow the link in that email to manage or cancel the ticket.

      If assistance is needed, the contact form below can be used. Include the full name and ticket number (e.g., TCK5-1).
      Refunds are exclusively issued to the same payment method used for the original purchase.
      
      Refunds are free of charge when issued to credit cards, PayPal, or SEPA accounts (EUR accounts within the European payment area).
      For international bank transfers (SWIFT), any bank fees incurred must be deducted from the refund amount.
    link: '#contact'
    link_display: Contact form
    display: true
    order: 999
  - id: return-social-event-ticket
    section: tickets
    question: I just need to cancel my Social Event ticket but keep my conference ticket.
    answer: |
      Social Event tickets cannot be canceled directly through the ticket shop.
      Please contact us via the contact form — we are happy to cancel and reimburse them until 2 April 2027.
    link: '#contact'
    link_display: Contact form
    display: true
    order: 999
  - id: badge-info
    section: tickets
    question: How can information on conference badges be updated?
    answer: |
      Badge information is taken directly from the details provided through the ticket shop.  
      Any updates must be made in ticket shop by following the links included in the ticket confirmation emails.  
  
      The following information can be updated:
      <ol>
        <li>Name</li>
        <li>Company name</li>
        <li>Email</li>
      </ol>
  
      For multiple ticket purchases, please ensure that all attendees enter their information promptly.  
      Badges are printed in advance, so changes made after the specified deadline will not be reflected.
      
      Please ensure that the ticket email address is directly accessible to the attendee, as important conference information will be sent to them.
      You may use any email address for the purchase.
    display: false
    order: 999
  - id: certificate-of-attendance
    section: tickets
    question: Do you issue a certificate of attendance for participants?
    answer: Yes, we do issue a certificate of attendance. These will be sent out after
      the conference via email.
    display: true
    order: 999
# ############################################################################################
# PROGRAM
# ############################################################################################
- name: Program
  id: program
  order: 4
  display: true
  qa:
  - id: how-will-the-program-look-like
    section: program
    question: How will the program look like?
    answer: The program will feature a mix of keynotes, talks, workshops, panels and community
      sessions, tailored to offer diverse perspectives and practical insights. While
      the final lineup will be shaped by the submissions we receive during the CfP,
      our goal is to create a balanced and engaging schedule that reflects the latest
      trends and innovations.
    link: /archive/2026/
    link_display: Check out the previous year's program here.
    display: true
    order: 999
  - id: tutorials
    section: program
    question: What about tutorials?
    answer: |
      There will be 90-minute tutorials on conference days. The attendance is included in the ticket but seats are limited.

      Please note that tutorials take place at the Business Development Center Heidelberg (BDC), a ten-minute walk from the main venue. Use the adjacent 30-minute coffee breaks to switch venues.
    display: true
    order: 999
  - id: how-can-i-speak-at-the-conference
    section: program
    question: How can I speak at the conference?
    answer: See the Call for Proposals for more information and the milestones above
      for submission deadlines. We also offer exclusive speaking opportunities to
      sponsors, see sponsoring.
    link: /call-for-proposals/
    link_display: Link to Call for Proposals
    display: true
    order: 1
  - id: support-program-for-speakers
    section: program
    question: Is there a support program for speakers?
    answer: 'Each accepted proposal includes one complimentary conference ticket, to be used by any one speaker on that proposal.
    
    While we don’t provide speaker travel funding, financial aid is available for attendees who need support with travel and accommodation.
	If you’d like to be considered, please apply before the programme closes (see milestones above).'
    link: /financial-aid/
    link_display: Link to Financial Aid Programme
    display: true
    order: 2
  - id: speaker-exception-without-financial-aid
    section: program
    question: Will you consider making any exception if I am a speaker but have not secured financial aid?
    answer: |
      We understand that individual situations can be difficult. However, in general, we do not make individual exceptions for speakers who have not secured financial aid, as we want to apply the same rules fairly and consistently to everyone.
    display: true
    order: 3
  - id: presenting-remotely
    section: program
    question: Can presentations be given remotely?
    answer: |
      Remote presentations are not accepted.  
      All speakers are required to present their sessions on site. Absolutely no exceptions.
    display: true
    order: 999
  - id: are-speakers-invited-to-the-conference
    section: program
    question: Are speakers invited to attend the conference?
    answer: |
      Each accepted talk proposal includes **one** complimentary conference ticket for the primary speaker.
      Co-presenters are kindly asked to purchase their own tickets.

      For accepted tutorials, up to **two** complimentary tickets are provided if both speakers are actively contributing to the session.

      Participation in additional activities (e.g., social events) requires a separate purchase.
    display: true
    order: 999
  - id: what-if-i-have-purchased-a-ticket-and-get-a-free-speaker-ticket-later
    section: program
    question: What happens if a ticket was purchased before receiving a free speaker ticket?
    answer: |
      Got your talk accepted after buying a ticket? We refund it, and you keep your edition and shirt.
      The same applies to volunteers and organizers.
    display: true
    order: 999
  - id: i-have-updated-some-information-but-it-does-not-reflect-on-the-website
    section: program
    question: I have updated some information, but it does not appear on the website. Why?
    answer: |
      The conference website is static and regularly synchronized with data from Pretalx.  
      Updates may take some time to appear, so a short delay is normal.  
    
      Please note that all information updates must be made directly through Pretalx.  
      Requests sent by email or to the helpdesk cannot be processed.
    display: true
    order: 999
  - id: what-about-internet-during-my-talk
    section: program
    question: Will internet access be available during my talk?
    answer: |
      Internet access during talks is **not guaranteed**.  
      Presentations should not rely on a stable internet connection.  
  
      While efforts are made to ensure good WiFi coverage, performance may vary and cannot be guaranteed.  
      Use of the conference network is at the speaker’s own risk.
    display: true
    order: 999
  - id: multiple-speakers
    section: program
    question: How many speakers can be listed on a talk proposal?
    answer: |
      A maximum of two speakers can be listed per talk proposal due to technical constraints. Please don’t add more than two speakers.
    display: true
    order: 999
  - id: adding-speakers
    section: program
    question: Can I add or change speakers after submitting a proposal?
    answer: |
      Please make sure all speakers (including co-speakers) are listed on the proposal before the CFP closes.
      Once the CFP has closed, we can’t add or change speakers. 
      This helps us keep the review process fair and consistent, and ensures we can confirm speaker details,
      scheduling, registration, and accessibility needs in time.
    display: true
    order: 999
