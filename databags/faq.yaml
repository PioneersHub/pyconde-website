# ############################################################################################
# RECORDINGS & VIDEOS
# ############################################################################################
- name: Recordings & Videos
  id: recordings
  order: 5
  display: true
  qa:
  - id: are-talks-recorded
    section: recordings
    question: Are talks recorded?
    answer: |
      Yes. Talks and tutorials are streamed and recorded.

      Other formats, such as Masterclasses, Discussion Sessions, Roundtables, Topic Clinics, or Birds of a Feather (BoF), are neither streamed nor recorded.
    display: true
    order: 1
  - id: watch-talks-during-conference
    section: recordings
    question: How can I watch talks during the conference?
    answer: |
      During the conference, all talks are available as a livestream through our video app.
      Access requires a valid on-site or remote ticket.
    display: true
    order: 2
  - id: rewatch-talks-during-conference
    section: recordings
    question: Can I rewatch talks during the conference?
    answer: |
      Yes. We plan to deliver rough cuts of all talks overnight, so you can watch or rewatch sessions in our video app the next day.
    display: true
    order: 3
  - id: recordings-after-conference
    section: recordings
    question: Will talk recordings be available after the conference?
    answer: |
      Yes. All talks and their recordings remain available to ticket holders in our video app after the conference ends.
      A public release of the recordings is planned approximately three months after the conference.
    display: true
    order: 4
  - id: early-access-recordings
    section: recordings
    question: Can recordings be made available earlier?
    answer: |
      Early access to video recordings before the public release is available to sponsors on request only.
    display: true
    order: 5
  - id: discussion-sessions
    section: recordings
    question: What are Discussion Sessions, Roundtables, Topic Clinics, or Birds of a Feather (BoF)?
    answer: |
      We believe that open communication, meaningful conversations, and the exchange of ideas are more important than ever. That’s why we’ve introduced dedicated Discussion Sessions to our conference program.

      Unlike traditional talks, these sessions are all about interaction. Whether it’s a roundtable discussion, a topic clinic, or a Birds of a Feather (BoF) gathering, the focus is on sharing experiences, exploring different perspectives, asking questions, and learning from each other.

      These sessions will not be recorded. We want to create an environment where participants feel comfortable speaking openly, asking difficult questions, sharing unfinished ideas, and discussing challenges without worrying about being recorded or quoted out of context.

      There are no slides required, no formal presentations, and no expectation of having all the answers. Just a topic, a group of interested people, and the opportunity for meaningful exchange.

      Come with questions, ideas, experiences, or simply curiosity. Everyone is welcome to contribute.
    display: true
    order: 6
