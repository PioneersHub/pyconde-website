# ACCESSIBILITY
# ############################################################################################
- name: Accessibility
  id: accessibility
  order: 11
  display: true
  qa:
  - id: what-about-accessibility
    section: accessibility
    question: Is the venue accessible?
    answer: |
      Yes. The Heidelberg Congress Center (HCC) is fully barrier-free, with a hearing loop and a guidance system for blind and visually impaired visitors.

      All entrances are step-free, eight lifts connect the event levels, and the handrails carry tactile orientation information.

      The HCC is one minute from Heidelberg main station. The tram and bus stop "Hauptbahnhof Süd" is right in front of the venue, and the barrier-free car park P21 HCC is on site.
      Detailed information can be found on the venue’s website.
    link: https://heidelberg-congress.com/en/heidelberg-congress-center/
    link_display: Venue information (HCC Heidelberg)
    display: true
    order: 999

  - id: i-need-assistance
    section: accessibility-assistance
    question: How can accessibility assistance be requested?
    answer: |
      The conference team is happy to assist with accessibility needs and will make every effort to ensure the event is as accessible as possible.
      Please use the contact form to share specific requirements in advance so that appropriate arrangements can be considered.
    link: /contact/
    link_display: Contact form
    display: true
    order: 999
