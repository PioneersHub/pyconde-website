# AWS SAM Configuration for PyConDE Contact Form API
# ===================================================
# This file contains preset deployment parameters to avoid manual entry during sam deploy.
#
# Usage (production runs the secure stack):
#   sam build --config-env secure && sam deploy --config-env secure
#   sam build && sam deploy   # basic (default env) - same stack name, use with care
#
# Each env builds into its own directory and deploys only that build's
# template. Deploying the build output (not the source template) is what
# keeps .env, .aws-sam/ and __pycache__ out of the Lambda package: SAM's
# Python builder excludes them, while packaging the source template would
# zip the whole backend/ directory (CodeUri: ./).
#
# Note: Sensitive values (API keys, secrets) should be passed via --parameter-overrides
# or loaded from .env file. See DEPLOY.md for details.

version = 0.1

[default.global.parameters]
stack_name = "pyconde-contact-form"
region = "eu-central-1"

# Basic deployment configuration (template.yaml)
[default.deploy.parameters]
template_file = ".aws-sam/build-basic/template.yaml"
stack_name = "pyconde-contact-form"
region = "eu-central-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
resolve_s3 = true
s3_prefix = "pyconde-contact-form"
image_repositories = []

# Parameter overrides for basic template
# Note: RecaptchaSecretKey and MailgunApiKey must be provided via --parameter-overrides
# because they are sensitive and not stored in this file
parameter_overrides = [
    "RecaptchaSiteKey=6LdlpgUrAAAAAERKT-_pzgwzjAIefN14ZErgkzyg",
    "MailgunDomain=mg.pycon.de",
    "MailgunApiBaseUrl=https://api.eu.mailgun.net/v3",
    "EmailRecipient=info27@pycon.de",
    "EmailSender=noreply@pycon.de",
    "AllowedOrigins=https://pycon.de"
]

# Secure deployment configuration (template-secure.yaml) - RECOMMENDED
[secure.deploy.parameters]
template_file = ".aws-sam/build-secure/template.yaml"
stack_name = "pyconde-contact-form"
region = "eu-central-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
resolve_s3 = true
s3_prefix = "pyconde-contact-form"
image_repositories = []

# Parameter overrides for secure template with WAF
# Note: RecaptchaSecretKey, MailgunApiKey, and ApiKey must be provided via --parameter-overrides
parameter_overrides = [
    "RecaptchaSiteKey=6LdlpgUrAAAAAERKT-_pzgwzjAIefN14ZErgkzyg",
    "MailgunDomain=mg.pycon.de",
    "MailgunApiBaseUrl=https://api.eu.mailgun.net/v3",
    "EmailRecipient=info27@pycon.de",
    "EmailSender=noreply@pycon.de",
    "AllowedOrigins=https://pycon.de"
]

# Build parameters, one build directory per env so a deploy can never pick up
# the other template's build
[default.build.parameters]
template_file = "template.yaml"
build_dir = ".aws-sam/build-basic"
cached = true
parallel = true

[secure.build.parameters]
template_file = "template-secure.yaml"
build_dir = ".aws-sam/build-secure"
cached = true
parallel = true
