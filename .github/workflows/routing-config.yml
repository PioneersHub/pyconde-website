name: Apply hosting redirect config (on demand)

# Applies the prefix rewrites in databags/routing.yaml to the website
# configuration of every bucket in databags/deploy_targets.yaml — the
# /latest/ alias and anything added beside it.
# See databags/routing.yaml and utils/generate_routing_config.py.
#
# Deliberately NOT part of the deploy workflows. `put-bucket-website` replaces
# the entire website configuration, and the routing rules change once or twice
# a year, so running it on every push is all risk and no benefit. It is also
# the only workflow needing s3:PutBucketWebsite.
#
# The configuration is generated ONCE and applied identically to every bucket,
# without --merge. Two reasons. Merging per bucket would let the buckets end up
# with different IndexDocument/ErrorDocument, which defeats the point of a
# shared configuration; and it would preserve exactly the values this workflow
# exists to replace — a bucket carrying a hand-made SPA fallback
# (404 -> 301 /index.html) keeps whatever ErrorDocument came with it.
# databags/routing.yaml declares both documents and is the source of truth.
#
# Applying this REMOVES any catch-all fallback, so URLs that currently
# soft-redirect to the homepage start returning a real 404. Make sure the
# buckets are complete first — crawl sitemap.xml and expect every URL to be
# 200. See docs/deployment.md.
#
# Caveat worth knowing before the first run: S3 routing rules only fire on the
# bucket's *website* endpoint (bucket.s3-website.<region>.amazonaws.com). If a
# CDN sits in front using the REST endpoint (bucket.s3.<region>.amazonaws.com)
# as its origin, these rules never run and the alias needs an edge function
# instead. Check the distribution's origin domain first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and print the configuration without applying it."
        type: boolean
        default: true

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install pyyaml

      - name: Apply routing configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_S3_REGION }}
          # Resolves the `env:AWS_S3_BUCKET` entry in databags/deploy_targets.yaml.
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python utils/generate_routing_config.py
          echo "Configuration to apply:"
          cat site-config/s3-website-routing.json

          # Assignment first: a failing command substitution in argument
          # position is swallowed by bash -e, a failing assignment is not.
          BUCKETS=$(python utils/deploy_targets.py)

          for BUCKET in $BUCKETS; do
            echo "::group::${BUCKET}"
            # Printed for the audit trail, not merged. put-bucket-website has
            # no undo — this output is the only rollback material, so save it.
            echo "Current configuration:"
            aws s3api get-bucket-website --bucket "$BUCKET" || echo "  (none)"

            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — not applying to ${BUCKET}. Re-run with dry_run=false."
            else
              aws s3api put-bucket-website --bucket "$BUCKET" \
                --website-configuration "file://site-config/s3-website-routing.json"
              echo "Applied. Verifying:"
              aws s3api get-bucket-website --bucket "$BUCKET"
            fi
            echo "::endgroup::"
          done
