name: Upload website (S3)

# Since ~Jul 29 the AWS_S3_BUCKET secret no longer matches the bucket
# nginx serves, so these deploys upload into the void. Fix the secret
# before relying on this workflow again.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install -r requirements.txt

#      - name: Build sponsor pages
#        run: make sponsor-pages

      - name: Build static page (current edition only)
        # Archive editions and certificates deploy on demand via
        # archive-build.yml — see plans/selective-builds.md.
        run: make build BUILD_MODE=current

      - name: Upload to s3
        uses: jakejarvis/s3-sync-action@master
        env:
          SOURCE_DIR: site
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET}}
          AWS_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload to s3 (temp-migration time)
        uses: jakejarvis/s3-sync-action@master
        env:
          SOURCE_DIR: site
          AWS_S3_BUCKET: pyconde-27
          AWS_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}