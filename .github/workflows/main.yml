name: Upload website (S3)

# Deploys the current edition to every bucket in databags/deploy_targets.yaml.
# That file is the only place buckets are named — see utils/deploy_to_s3.py.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install -r requirements.txt

#      - name: Build sponsor pages
#        run: make sponsor-pages

      - name: Build static page (current edition only)
        # Archive editions deploy on demand via archive-build.yml —
        # see plans/selective-builds.md.
        run: make build BUILD_MODE=current

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_S3_REGION }}
          # Resolves the `env:AWS_S3_BUCKET` entry in databags/deploy_targets.yaml.
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        # --scope full uploads everything this build rendered, which for
        # BUILD_MODE=current is the current edition only. The sync never
        # deletes, so the archive already in the bucket stays live.
        run: python utils/deploy_to_s3.py --scope full
