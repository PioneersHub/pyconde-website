name: Update the current site

# One of the site's two update operations. The other is archive-build.yml,
# which publishes past editions on demand.
#
# This one runs by itself on every push to main and publishes the current
# edition — everything except /archive/**. Deploy targets come from
# databags/deploy_targets.yaml, the only place buckets are named.
#
# It also runs daily just after midnight Berlin time, so ticket prices
# switch to the next edition on its `opens` date (databags/tickets.yaml)
# without anyone having to push.
on:
  push:
    branches: ["main"]
  schedule:
    # 23:01 UTC = 00:01 CET / 01:01 CEST; edition switches fall in CET.
    - cron: "1 23 * * *"
  workflow_dispatch:

# One write to the production buckets at a time, shared with
# archive-build.yml. Merges minutes apart used to deploy in parallel, and
# whichever run finished last won — an older commit's pages could overwrite
# a newer one's.
#   cancel-in-progress: false  a running deploy is never stopped halfway
#                              through a bucket.
#   queue: max                 every waiting run is kept. The default keeps
#                              only one per group, so a merge would cancel a
#                              waiting archive dispatch, or a dispatch the
#                              deploy of the latest merge.
# Waiting runs start roughly, not strictly, in order, so the checkout below
# takes the branch tip rather than the triggering commit: whichever run goes
# last deploys the newest main.
concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  build:
    # Skips events sent by bots and GitHub Apps (sender type 'Bot'); scheduled
    # runs are exempt, so a bot's push to main goes live with the nightly run.
    # See docs/deployment.md, "Who can trigger a run".
    if: github.event_name == 'schedule' || github.event.sender.type == 'User'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The branch tip when this run starts, not github.sha — see concurrency.
          ref: ${{ github.ref }}

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install -r requirements.txt

#      - name: Build sponsor pages
#        run: make sponsor-pages

      - name: Sync ticket pricing to today's edition
        run: make sync-pricing

      - name: Build static page (current edition only)
        # Archive editions deploy on demand via archive-build.yml —
        # see plans/selective-builds.md.
        run: make build BUILD_MODE=current

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_S3_REGION }}
          # Resolves the `env:AWS_S3_BUCKET` entry in databags/deploy_targets.yaml.
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        # --scope full uploads everything this build rendered, which for
        # BUILD_MODE=current is the current edition only. The sync never
        # deletes, so the archive already in the bucket stays live.
        run: python utils/deploy_to_s3.py --scope full

      - name: Refresh talk permalinks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        # /talks/{PRETALX_CODE}/ is the permanent URL for a talk. Reconciling on
        # every deploy means a new talk gets its permalink on the same push that
        # publishes the page, and nobody maintains a redirect by hand.
        # See utils/talk_permalinks.py.
        run: python utils/talk_permalinks.py
