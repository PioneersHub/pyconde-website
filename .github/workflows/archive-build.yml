name: Build archive (on demand)

# Archive editions are static after their initial generation — production
# deploys (main.yml) build only the current edition. Dispatch this workflow
# to rebuild and deploy them. See plans/selective-builds.md.
#
# Deploy targets come from databags/deploy_targets.yaml, the same list
# main.yml and routing-config.yml read, so a bucket cannot be added to one
# workflow and forgotten in another.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          archive: full render, deploy only the archive scope.
          full: full render + Pagefind search index, deploy everything.
        type: choice
        options:
          - archive
          - full
        default: archive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      # pagefind lives in pyproject's dev dependency group, which the
      # compiled requirements.txt does not include — full mode needs it.
      - run: pip install -r requirements.txt pagefind pagefind-bin

      # No `make sponsor-pages` here. utils/sponsors.py recreates
      # content/sponsors/ from databags/sponsors.yaml, and that subtree was
      # archived to content-archived/ — running it would rebuild and, in
      # full mode, republish pages that were deliberately taken down.
      # main.yml has had the step disabled since a25066a7.

      - name: Build static page (${{ inputs.mode }})
        run: make build BUILD_MODE=${{ inputs.mode }}

      - name: Deploy to S3 (${{ inputs.mode }} scope)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_S3_REGION }}
          # Resolves the `env:AWS_S3_BUCKET` entry in databags/deploy_targets.yaml.
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DEPLOY_SCOPE: ${{ inputs.mode }}
        # The archive scope derives from databags/selective_build.yaml — the
        # same list the selective-build plugin excludes from current builds,
        # so build scope and deploy scope cannot drift apart.
        run: python utils/deploy_to_s3.py --scope "$DEPLOY_SCOPE"
