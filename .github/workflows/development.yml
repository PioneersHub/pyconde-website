name: Upload staging website

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    # Only people run builds, never bots or GitHub Apps: an app's sender type
    # is 'Bot'. Fork PRs from outside the organization additionally wait for
    # a team member to approve the run (repository Actions setting).
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Sync ticket pricing to today's edition
        run: make sync-pricing

      - name: Build static page (current edition only)
        run: make build BUILD_MODE=current

      - name: Save staging website
        uses: actions/upload-artifact@v4
        with:
          name: staging-site
          path: site
          if-no-files-found: error
          retention-days: 1

  staging:
    needs: build
    # Forks only build. Deploy separately so build commands never receive
    # deployment secrets or a token that can write PR comments.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download staging website
        uses: actions/download-artifact@v4
        with:
          name: staging-site
          path: site

      - name: Upload to s3
        uses: jakejarvis/s3-sync-action@master
        env:
          SOURCE_DIR: site
          AWS_S3_BUCKET: 'pyconde-27-staging'
          AWS_REGION: 'eu-central-1'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Post Staging URL as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const stagingUrl = "http://pyconde-27-staging.s3-website.eu-central-1.amazonaws.com/";

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
              body: `🚀 The staging site is live! [View here](${stagingUrl})`
            });
